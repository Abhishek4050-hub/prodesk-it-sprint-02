
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash-Flow Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Cash-Flow</a>
    <div class="d-flex gap-2">
      <select id="currency" class="form-select form-select-sm">
        <option value="INR">INR ₹</option>
        <option value="USD">USD $</option>
      </select>
      <button id="theme" class="btn btn-outline-light btn-sm">Dark mode</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2>My Expense Tracker</h2>
  <p class="text-secondary">Manage your monthly income and expenses.</p>

  <div id="message" class="alert alert-danger d-none"></div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card p-3">
        <p>Monthly Salary</p>
        <h4 id="salary">₹0</h4>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3">
        <p>Total Expenses</p>
        <h4 id="total">₹0</h4>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3">
        <p>Remaining Balance</p>
        <h4 id="balance">₹0</h4>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-5">
      <div class="card p-3 mb-3">
        <h5>Set Salary</h5>
        <form id="salaryForm" novalidate>
          <input type="number" id="salaryInput" class="form-control mb-3"
            placeholder="Enter salary" min="0" step="0.01" required>
          <button class="btn btn-primary w-100">Save Salary</button>
        </form>
      </div>

      <div class="card p-3">
        <h5>Add Expense</h5>
        <form id="expenseForm" novalidate>
          <input type="text" id="name" class="form-control mb-3"
            placeholder="Expense name" maxlength="80" required>
          <input type="number" id="amount" class="form-control mb-3"
            placeholder="Amount" min="0" step="0.01" required>
          <button class="btn btn-success w-100">Add Expense</button>
        </form>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card p-3 mb-3">
        <h5>Monthly Summary</h5>
        <div class="chart">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Expense List</h5>
          <button id="pdf" class="btn btn-outline-primary btn-sm">Download PDF</button>
        </div>
        <ul id="list" class="list-group list-group-flush"></ul>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
